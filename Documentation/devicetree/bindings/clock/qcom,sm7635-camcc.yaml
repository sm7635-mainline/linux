%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm7635-camcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Camera Clock & Reset Controller on SM7635

maintainers:
  - Danila Tikhonov <danila@jiaxyga.com>

description: |
  Qualcomm camera clock control module provides the clocks, resets and power
  domains on SM7635.

  See also: include/dt-bindings/clock/qcom,sm7635-camcc.h


properties:
  compatible:
    const: qcom,sm7635-camcc

  clocks:
    items:
      - description: Board XO source
      - description: Sleep clock source

  power-domains:
    maxItems: 1
    description:
      A phandle and PM domain specifier for the CX power domain.

  reg:
    maxItems: 1

required:
  - compatible
  - clocks
  - power-domains

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gcc-sm7635.h>
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>

    clock-controller@ade0000 {
      compatible = "qcom,sm7635-camcc";
      reg = <0xade0000 0x40000>;
      clocks = <&rpmhcc RPMH_CXO_CLK>,
               <&sleep_clk>;
      power-domains = <&rpmhpd RPMHPD_CX>;
      #clock-cells = <1>;
      #reset-cells = <1>;
      #power-domain-cells = <1>;
    };
...
